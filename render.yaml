# BlackSwanSI on Render's FREE plan.
# Free instances sleep after ~15 min without traffic and lose their disk on restart. BlackSwanSI copes with both:
#   * keepalive: it pings its own /health address (plus you add a free outside pinger, see DEPLOY_BLACKSWANSI.md)
#   * persistence: an ENCRYPTED copy of its database is pinned in your private Telegram chat and restored on startup
# When you want it sturdier, switch to render.paid.yaml (or change the plan in the Render dashboard).
services:
  - type: web
    name: blackswansi
    runtime: docker
    plan: free
    # Binance blocks some regions (notably the US). Singapore works for most people.
    region: singapore
    healthCheckPath: /health
    autoDeploy: false            # redeploy only when you click it, so nothing changes under a running bot
    envVars:
      - key: DEV_MODE
        value: "false"
      - key: DATABASE_PATH
        value: data/trading_bot.db
      - key: BOT_TOKEN            # from @BotFather
        sync: false
      - key: ADMIN_IDS            # your numeric Telegram id (from @userinfobot)
        sync: false
      - key: ENCRYPTION_KEY       # generated by Render. COPY IT somewhere safe after the first deploy
        generateValue: true
      - key: WEBHOOK_SECRET       # generated by Render
        generateValue: true
      - key: BACKUP_TO_TELEGRAM
        value: "true"
      - key: KEEPALIVE
        value: "true"
      - key: ALLOW_LIVE_TRADING   # keep false until paper results look right and you are on a paid plan
        value: "false"
      - key: ENABLE_EARN
        value: "false"
